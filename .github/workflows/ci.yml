name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API 37 and Build-Tools
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and instrumented-test APK
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest \
            --no-daemon --console=plain \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:-TieredCompilation -Dfile.encoding=UTF-8'
